# Main comparison, method: Failure-Guided Attack Sampling on the hardened
# benchmark. Identical to hard_uniform.yaml except for the fgas block.
_base_: hard_base.yaml

experiment:
  name: hard_fgas

train:
  epochs: 60
  image_loss_weight: 100.0

fgas:
  enabled: true
  update_interval: 2
  min_prob: 0.05
  power: 1.0
  momentum: 0.5
