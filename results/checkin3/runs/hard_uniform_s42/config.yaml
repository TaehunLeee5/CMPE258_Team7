experiment:
  name: hard_uniform_s42
  seed: 42
  output_dir: /content/drive/MyDrive/CMPE258_Team7/runs_hardened
  device: auto
data:
  dataset: coco
  raw_root: data/DIV2K
  prepared_root: data/div2k_prepared
  num_train_images: 4500
  num_val_images: 500
  prepare_short_side: 256
  image_size: 128
  train_samples_per_epoch: 4096
  val_crops_per_image: 2
  num_workers: 0
  synthetic: false
  coco_raw_root: data/COCO
  coco_prepared_root: data/coco_prepared
  test:
    prepared_root: data/div2k_prepared
    split: val
    num_images: 100
    crops_per_image: 4
    seed: 0
message:
  length: 32
model:
  encoder_channels: 64
  encoder_blocks: 4
  message_embed: spatial
  message_grid: 16
  message_channels: 8
  decoder_channels: 64
  decoder_blocks: 7
  decoder_pool: 4
train:
  epochs: 60
  batch_size: 32
  lr: 0.001
  image_loss_weight: 200.0
  image_loss_weight_start: 1.0
  image_loss_ramp_trigger_acc: 0.9
  image_loss_ramp_latest_epoch: 10
  image_loss_warmup_epochs: 8
  message_loss_weight: 1.0
  log_interval: 50
  init_checkpoint: null
  resume: null
attacks:
  train:
  - noise
  - blur
  - brightness
  - resize
  - jpeg
  - crop
  - occlusion
  eval:
  - clean
  - noise
  - blur
  - brightness
  - resize
  - jpeg
  - crop
  - occlusion
  initial_probs: null
  params:
    noise:
      std: 0.1
    blur:
      kernel_size: 9
      sigma: 2.0
    brightness:
      min_factor: 0.3
      max_factor: 1.7
    resize:
      scale: 0.25
    jpeg:
      quality:
      - 50
      - 90
    crop:
      keep:
      - 0.5
      - 0.8
    occlusion:
      area:
      - 0.1
      - 0.25
      fill: 0.5
    jpeg_real:
      quality: 50
    combo:
      stages:
      - - resize
        - scale: 0.5
      - - jpeg_real
        - quality: 50
  warmup:
  - noise
  - blur
  - brightness
  - resize
  extra_eval:
  - jpeg_real
  - combo
  sweep:
    noise:
    - std: 0.05
    - std: 0.1
    - std: 0.15
    - std: 0.2
    blur:
    - kernel_size: 9
      sigma: 1.0
    - kernel_size: 9
      sigma: 2.0
    - kernel_size: 13
      sigma: 3.0
    - kernel_size: 17
      sigma: 4.0
    brightness:
    - min_factor: 0.7
      max_factor: 1.3
    - min_factor: 0.5
      max_factor: 1.5
    - min_factor: 0.3
      max_factor: 1.7
    - min_factor: 0.1
      max_factor: 1.9
    resize:
    - scale: 0.75
    - scale: 0.5
    - scale: 0.35
    - scale: 0.25
    jpeg_real:
    - quality: 90
    - quality: 70
    - quality: 50
    - quality: 30
    - quality: 10
    crop:
    - keep: 0.9
    - keep: 0.7
    - keep: 0.5
    - keep: 0.35
    occlusion:
    - area: 0.1
    - area: 0.25
    - area: 0.4
    - area: 0.55
fgas:
  enabled: false
  update_at_start: false
  update_interval: 2
  min_prob: 0.05
  power: 1.0
  momentum: 0.5
